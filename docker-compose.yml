services:
  ecommerce-ui:
    build:
      context: ./ecommerce-ui
      dockerfile: Dockerfile
      args:
        VITE_PRODUCT_URL: http://localhost:8080
        VITE_CART_URL: http://localhost:8080
        VITE_REVIEW_URL: http://localhost:8080
        VITE_ORDER_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_healthy
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # jadi hostname DB harus nama service-nya di network Compose.
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PORT=3306
      - DB_PASSWORD=password
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: cart-db
      DB_PORT: 5432
      DB_DATABASE: cartdb
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword
      PRODUCT_SERVICE_HOST: http://product-service:3000
      LOG_CHANNEL: stderr
    depends_on:
      cart-db:
        condition: service_healthy
      product-service:
        condition: service_healthy
  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cartdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cartdb"]
      interval: 10s
      retries: 5
      timeout: 5s
  review-service:
    build:
      context: ./review-service
      dockerfile: Dockerfile
    env_file:
      - ./review-service/.env
    ports:
      - "3002:3002"
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      FLASK_DEBUG: "1"
      PRODUCT_SERVICE_URL: http://product-service:3000
    depends_on:
      review-db:
        condition: service_healthy
      product-service:
        condition: service_healthy
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:3003
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/orders.sqlite
      PORT: "3003"
    volumes:
      - order-db-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:3003/up') === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      PRODUCT_URL: http://product-service:3000
      CART_URL: http://cart-service:3001
      REVIEW_URL: http://review-service:3002
      ORDER_URL: http://order-service:3003
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_started
      review-service:
        condition: service_started
      order-service:
        condition: service_healthy
  review-db:
    image: mongo:7
    env_file:
      - ./review-service/.env
    ports:
      - "27017:27017"
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s
  product-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword

    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  product-db-data:
  cart-db-data:
  review-db-data:
  order-db-data: